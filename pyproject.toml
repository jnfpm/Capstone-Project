[project]
name = "clear-aml"
version = "0.1.0"
description = "CLEAR - Collaborative Laundering Evidence & Alert Review (Multi-Agent AML Decision Support)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "alerts_model"]

[tool.pytest.ini_options]
testpaths = ["agents/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

